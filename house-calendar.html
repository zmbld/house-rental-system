<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head"></head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-house-heart"></i> 民宿预订平台
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/house/calendar"><i class="bi bi-calendar-week"></i> 房态日历</a></li>
                </ul>
                <ul class="navbar-nav" id="navRight"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h4 class="mb-3"><i class="bi bi-calendar-week"></i> 房态日历管理</h4>

        <div class="row g-2 align-items-center mb-3">
            <div class="col-md-4">
                <select id="houseSel" class="form-select" onchange="onHouseChange()"></select>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-secondary btn-sm" onclick="changeMonth(-1)">&laquo; 上月</button>
                <span id="monthLabel" class="fw-bold mx-2"></span>
                <button class="btn btn-outline-secondary btn-sm" onclick="changeMonth(1)">下月 &raquo;</button>
            </div>
        </div>

        <div class="border rounded p-3 bg-white shadow-sm">
            <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;"></div>
        </div>
        <div class="mt-2 small text-muted">
            图例：<span class="badge bg-success">可订</span>
            <span class="badge bg-danger">已订（不可操作）</span>
            <span class="badge bg-secondary">已封锁</span>
            · 点击日期可封锁/解封、设置特殊价格（节假日调价）
        </div>
    </div>

    <!-- 日期操作模态框 -->
    <div class="modal fade" id="dayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dayTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="dayInfo"></div>
                <div class="modal-footer" id="dayActions"></div>
            </div>
        </div>
    </div>

    <script>
        let houses = [];
        let curHouseId = null;
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth() + 1;
        let selDay = null;
        let dayModal = null;

        // 初始化：检查登录与角色
        fetch('/api/user/current').then(r => r.json()).then(res => {
            if (res.code !== 200 || !res.data) {
                location.href = '/login';
                return;
            }
            const user = res.data;
            if (user.role !== 'LANDLORD' && user.role !== 'ADMIN') {
                alert('仅房东可管理房态日历');
                location.href = '/';
                return;
            }
            document.getElementById('navRight').innerHTML = `
                <li class="nav-item"><a class="nav-link text-light" href="/">${user.nickname}</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#" onclick="logout()">退出</a></li>`;
            loadMyHouses();
        });

        function loadMyHouses() {
            fetch('/api/house/my').then(r => r.json()).then(res => {
                const sel = document.getElementById('houseSel');
                if (res.code !== 200 || !res.data || res.data.length === 0) {
                    sel.innerHTML = '<option>暂无房源，请先发布</option>';
                    document.getElementById('calGrid').innerHTML =
                        '<div class="text-muted p-4">您还没有房源，<a href="/house/publish">去发布房源</a></div>';
                    return;
                }
                houses = res.data;
                sel.innerHTML = houses.map(h => `<option value="${h.id}">${h.name}（${h.city}）</option>`).join('');
                curHouseId = houses[0].id;
                loadMonth();
            });
        }

        function onHouseChange() {
            curHouseId = Number(document.getElementById('houseSel').value);
            loadMonth();
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth > 12) { calMonth = 1; calYear++; }
            if (calMonth < 1) { calMonth = 12; calYear--; }
            loadMonth();
        }

        function loadMonth() {
            document.getElementById('monthLabel').textContent = calYear + '年' + calMonth + '月';
            if (!curHouseId) return;
            fetch(`/api/house/calendar/${curHouseId}?year=${calYear}&month=${calMonth}`)
                .then(r => r.json()).then(res => {
                    if (res.code === 200) renderCal(res.data);
                });
        }

        function renderCal(days) {
            const grid = document.getElementById('calGrid');
            const weekdays = ['日','一','二','三','四','五','六'];
            let html = weekdays.map(w =>
                `<div class="text-center fw-bold text-muted small py-1">${w}</div>`).join('');

            const offset = new Date(calYear, calMonth - 1, 1).getDay();
            for (let i = 0; i < offset; i++) html += '<div></div>';

            days.forEach(d => {
                const status = d.status || 'AVAILABLE';
                const cls = status === 'BOOKED' ? 'danger' : status === 'BLOCKED' ? 'secondary' : 'success';
                const stText = status === 'BOOKED' ? '已订' : status === 'BLOCKED' ? '封锁' : '可订';
                const priceHtml = d.specialPrice
                    ? `<div class="text-danger small fw-bold">&yen;${d.specialPrice}</div>` : '';
                const cursor = status === 'BOOKED' ? 'default' : 'pointer';
                html += `
                    <div class="border rounded p-2 text-center" style="min-height:72px;cursor:${cursor};"
                         onclick="openDay('${d.date}', '${status}', ${d.specialPrice || 'null'})"
                         title="${status === 'BOOKED' ? '已预订，不可操作' : '点击管理'}">
                        <div class="fw-bold">${Number(d.date.slice(-2))}</div>
                        <span class="badge bg-${cls}" style="font-size:.7rem">${stText}</span>
                        ${priceHtml}
                    </div>`;
            });
            grid.innerHTML = html;
        }

        function openDay(date, status, price) {
            if (status === 'BOOKED') {
                alert('该日期已被预订，不能修改');
                return;
            }
            selDay = { date: date, status: status, price: price };
            document.getElementById('dayTitle').textContent = date;
            document.getElementById('dayInfo').innerHTML =
                `当前状态：<span class="badge bg-${status === 'BLOCKED' ? 'secondary' : 'success'}">${status === 'BLOCKED' ? '已封锁' : '可订'}</span>` +
                (price ? `<div class="mt-2">特殊价格：<span class="text-danger fw-bold">&yen;${price}</span></div>` : '');
            document.getElementById('dayActions').innerHTML =
                `<button class="btn btn-outline-primary btn-sm me-auto" onclick="setSpecialPrice()">设置特殊价格</button>` +
                (status === 'BLOCKED'
                    ? '<button class="btn btn-success btn-sm" onclick="setStatus(\'AVAILABLE\')">解封</button>'
                    : '<button class="btn btn-outline-secondary btn-sm" onclick="setStatus(\'BLOCKED\')">封锁</button>');
            if (!dayModal) dayModal = new bootstrap.Modal(document.getElementById('dayModal'));
            dayModal.show();
        }

        function setStatus(status) {
            fetch('/api/house/calendar/set-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({houseId: curHouseId, date: selDay.date, status: status})
            }).then(r => r.json()).then(res => {
                if (res.code === 200) {
                    dayModal.hide();
                    loadMonth();
                } else {
                    alert(res.msg);
                }
            });
        }

        function setSpecialPrice() {
            const input = prompt('请输入该日期的每晚特殊价格（元）：', selDay.price || '');
            if (input === null) return;
            const price = parseFloat(input);
            if (isNaN(price) || price <= 0) {
                alert('请输入有效的价格');
                return;
            }
            fetch('/api/house/set-special-price', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({houseId: curHouseId, date: selDay.date, price: price})
            }).then(r => r.json()).then(res => {
                if (res.code === 200) {
                    dayModal.hide();
                    loadMonth();
                } else {
                    alert(res.msg);
                }
            });
        }

        function logout() {
            fetch('/api/user/logout').then(() => location.href = '/login');
        }
    </script>
</body>
</html>
