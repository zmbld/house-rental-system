<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head"></head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-house-heart display-4 text-primary"></i>
                            <h3 class="fw-bold mt-2">民宿预订平台</h3>
                            <p class="text-muted">欢迎回来，请登录您的账号</p>
                        </div>
                        <div id="errorMsg" class="alert alert-danger d-none"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-2">登 录</button>
                        </form>
                        <p class="text-center text-muted">还没有账号？<a href="/register">立即注册</a></p>
                        <div class="mt-3 p-3 bg-light rounded">
                            <small class="text-muted">测试账号：</small>
                            <div class="small">
                                <div>管理员: admin / 123456</div>
                                <div>房东: landlord1 / 123456</div>
                                <div>房客: tenant1 / 123456</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                username: this.username.value,
                password: this.password.value
            };
            fetch('/api/user/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(data)
            }).then(r => r.json()).then(res => {
                if (res.code === 200) {
                    location.href = '/';
                } else {
                    const err = document.getElementById('errorMsg');
                    err.textContent = res.msg;
                    err.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
